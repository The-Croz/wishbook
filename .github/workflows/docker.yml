name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for the boot test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wishbook:test
          cache-from: type=gha
      - name: Boot test with a root-owned data folder
        run: |
          set -e
          check() {
            name=$1; shift
            sudo rm -rf "/tmp/$name" && sudo mkdir -p "/tmp/$name" && sudo chown root:root "/tmp/$name"
            docker run -d --name "$name" -p 0:3000 -v "/tmp/$name:/data" -e ORIGIN=http://localhost -e ADMIN_USERNAME=ci -e ADMIN_PASSWORD=ci-password-123 "$@" wishbook:test
            port=$(docker port "$name" 3000/tcp | head -1 | cut -d: -f2)
            for i in $(seq 1 30); do curl -fs "http://localhost:$port/api/health" && break; sleep 1; done
            curl -fs "http://localhost:$port/api/health" || { docker logs "$name"; exit 1; }
            sudo test -f "/tmp/$name/wishbook.db" || { docker logs "$name"; exit 1; }
            echo; echo "$name ok: $(sudo stat -c %u:%g /tmp/$name/wishbook.db)"
            docker rm -f "$name"
          }
          check default
          check unraid -e PUID=99 -e PGID=100
          test "$(sudo stat -c %u:%g /tmp/unraid/wishbook.db)" = "99:100"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
