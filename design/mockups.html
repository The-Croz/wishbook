<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wishbook Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--red:#C8102E;--red-deep:#9A0C23;--ink:#1A1A1A;--page:#FFFFFF;--mustard:#F2B705;--pine:#2E7D5B;--rule:#E4E1DA;--muted:#5C5A55;--wash:#F4F2EE;--pink:#FFE3E7}
*{box-sizing:border-box;margin:0}
::selection{background:var(--mustard);color:var(--ink)}
body{background:#2B2422;color:#fff;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;line-height:1.45}
.intro{max-width:1240px;margin:0 auto;padding:44px 24px 12px}
.intro h1{font-family:'Archivo Black';font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-.02em}
.intro p{max-width:68ch;margin-top:12px;color:#E8DCD8;font-size:17px}
.board{max-width:1240px;margin:0 auto;padding:28px 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:44px 28px;justify-items:center}
figure{display:flex;flex-direction:column;gap:12px;width:390px}
figcaption b{font-family:'Archivo Black';font-size:18px;display:block}
figcaption{font-size:15px;color:#E8DCD8;max-width:390px}
.phone{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--page);color:var(--ink);box-shadow:0 0 0 10px #0f0c0b,0 24px 60px rgba(0,0,0,.45)}
.status{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-weight:700;font-size:15px}
.on-red{background:var(--red);color:#fff}
/* header */
.hdr{padding:10px 20px 18px}
.hdr .row{display:flex;justify-content:space-between;align-items:center}
.wm{font-family:'Archivo Black';font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.av{width:36px;height:36px;border-radius:50%;background:var(--mustard);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.hdr h2{font-family:'Archivo Black';font-size:32px;line-height:1.02;margin-top:14px;letter-spacing:-.015em;text-wrap:balance}
.hdr .meta{font-size:15px;margin-top:6px;color:var(--pink);font-weight:700}
.back{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px}
/* page */
.pg{color:var(--ink);background:var(--page);border-radius:22px 22px 0 0;padding:16px 16px 120px;min-height:100%}
.secthd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.secthd b{font-family:'Archivo Black';font-size:18px}
.secthd span{font-size:14px;font-weight:700;color:var(--muted)}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{padding:8px 14px;border-radius:99px;border:2px solid var(--ink);font-weight:700;font-size:14px;background:#fff}
.chip.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.it{position:relative;padding-bottom:4px}
.ph{height:132px;background:var(--wash);display:flex;align-items:center;justify-content:center;margin-bottom:8px;border-radius:4px}
.no{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.t{font-weight:700;font-size:15px;line-height:1.2;margin-top:2px}
.pr{font-family:'Archivo Black';font-size:21px;color:var(--red);margin-top:4px;font-variant-numeric:tabular-nums}
.pr s{color:var(--muted);font-family:'Atkinson Hyperlegible';font-size:13px;font-weight:400;margin-left:4px}
.hand{font-family:'Caveat',cursive;font-size:22px;line-height:1;color:var(--pine);margin-top:4px}
.mark{position:absolute;pointer-events:none}
.it.claimed .ph{opacity:.5}
/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:2px solid var(--ink);display:flex;justify-content:space-around;padding-top:10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.tab.on{color:var(--red)}
.tab svg{width:26px;height:26px}
.fab{position:absolute;right:16px;bottom:100px;height:56px;padding:0 22px 0 18px;border-radius:28px;background:var(--ink);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
/* family list */
.person{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule)}
.pav{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black';font-size:20px;flex:none}
.person .nm{font-weight:700;font-size:18px}
.person .sm{font-size:14px;color:var(--muted)}
.bar{height:8px;background:var(--wash);border-radius:4px;margin-top:6px;overflow:hidden;width:150px}
.bar i{display:block;height:100%;background:var(--pine)}
.go{margin-left:auto;color:var(--muted)}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;background:var(--mustard);padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
/* notes */
.note{display:flex;gap:10px;align-items:flex-start;background:var(--wash);border-radius:10px;padding:12px;font-size:14px;margin-bottom:14px}
.note svg{flex:none;margin-top:1px}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(26,26,26,.5)}
.sheet{color:var(--ink);position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px 34px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 14px}
.sheet h3{font-family:'Archivo Black';font-size:24px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.field{border:2px solid var(--ink);border-radius:10px;padding:12px;font-size:16px;display:flex;align-items:center;gap:8px;background:#fff}
.field.ok{border-color:var(--pine)}
.preview{display:flex;gap:12px;border:2px solid var(--rule);border-radius:12px;padding:12px;margin-top:14px}
.preview .ph{width:96px;height:96px;margin:0;flex:none}
.small{font-size:13px;color:var(--muted)}
.btn{height:56px;border-radius:14px;background:var(--red);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;margin-top:16px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.pine{background:var(--pine)}
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg span{flex:1;text-align:center;padding:10px 0;font-weight:700;font-size:14px}
.seg .on{background:var(--ink);color:#fff}
/* detail */
.hero{height:330px;background:var(--wash);display:flex;align-items:center;justify-content:center;position:relative}
.dt{padding:18px 20px 0}
.dt h3{font-family:'Archivo Black';font-size:26px;line-height:1.08;letter-spacing:-.01em}
.dt .pr{font-size:32px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.kv span:first-child{color:var(--muted)}
.claimbox{border:2px dashed var(--pine);border-radius:12px;padding:12px;margin-top:14px;font-size:14px}
/* login */
.login{position:absolute;inset:0;background:var(--red);color:#fff;padding:70px 28px 0}.login>svg{display:block;margin:0 auto 18px}
.login .field{border-color:#fff;background:#fff;color:var(--ink)}
.login label{color:#fff}
.login .btn{background:var(--ink)}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:440px){.board{padding:20px 0 60px;grid-template-columns:1fr}figure{transform:scale(.88);transform-origin:top center;margin-bottom:-100px}.intro{padding:32px 16px 0}figcaption{padding:0 8px}}
</style>
</head>
