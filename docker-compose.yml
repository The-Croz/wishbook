services:
  wishbook:
    image: ghcr.io/the-croz/wishbook:latest
    container_name: wishbook
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      # The public address people type, exactly as your reverse proxy serves it.
      ORIGIN: https://wishbook.example.com
      # Creates the first admin the very first time the app starts (ignored after that).
      ADMIN_USERNAME: josh
      ADMIN_PASSWORD: change-me-please
      # Nightly price checks and reminders run in this time zone.
      TZ: America/Chicago
      # Oxylabs Web API key: used only when Amazon blocks a lookup. Leave unset to turn off.
      # OXYLABS_API_KEY: your-key
      # Most Oxylabs lookups per month (default 300).
      # OXYLABS_MONTHLY_LIMIT: 300
      # Owner of ./data on the host (Unraid uses 99 and 100). Defaults to 1000.
      # PUID: 1000
      # PGID: 1000
